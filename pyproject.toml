[project]
name = "structural-health-monitor-api"
version = "1.0.0"
description = "Stateless FastAPI signal-processing backend for the SHM dashboard"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "numpy>=2.1,<3",
  "scipy>=1.14,<2",
  "obspy>=1.4.2,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.28,<1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*"]
exclude = ["app*", "components*", "lib*", "tests*", "node_modules*"]

[tool.ruff]
line-length = 100
target-version = "py311"
